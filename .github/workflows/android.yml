name: android apk

on:
  push:
    branches: [zakuro-android]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up the Android SDK pieces and the NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "build-tools;34.0.0" "platforms;android-34" "ndk;27c" >/dev/null
          echo "ANDROID_SDK=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$(ls -d "$ANDROID_HOME"/ndk/* | head -1)" >> "$GITHUB_ENV"

      - name: the Rust target the phone runs
        run: rustup target add thumbv7neon-linux-androideabi

      - name: build the APK
        env:
          CARGO_PROFILE_RELEASE_DEBUG: "0"
        run: bash android/build_apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: zakuro-redmi9a
          path: android/zakuro-redmi9a.apk
          if-no-files-found: error
