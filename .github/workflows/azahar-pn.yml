# =============================================================================
#  Azahar UI + motor Pocket Native — APK armeabi-v7a (32 bits) para Redmi 9A
#
#  Arquitectura del implante (APK "pocket", SIN núcleo Citra en C++):
#    - La interfaz es la de Azahar (lista de juegos, ajustes, atajos...).
#    - Los juegos Pocket Native (paquetes recompilados con el kit del PC,
#      scripts/build.sh --32bit) se importan desde Ajustes y aparecen en la
#      lista con la insignia "Pocket Native".
#    - Al jugarlos, la UI lanza PocketNativeActivity (proceso :pocketnative),
#      que aloja libpocketnative.so (zakuro): el motor reserva 1 GiB de
#      fastmem en un espacio de direcciones limpio — en 32 bits eso es lo que
#      evita los SIGBUS del enfoque en-proceso anterior.
#    - Se compila con -PpocketOnly=true: sin CMake, sin NDK-build del núcleo,
#      sin capas de validación de Vulkan. El APK solo lleva la UI (dex) y
#      libpocketnative.so; la biblioteca muestra únicamente juegos PN.
#
#  Este workflow fusiona:
#    - ci-32bit.yml de lavilao/pocket-native: compila el motor Rust para
#      armv7-linux-androideabi con el NDK del runner.
#    - redmi9a.yml de este repo: compila el APK vanilla release (v7a).
#  Además empaqueta los perfiles por título (titles/*/profile.toml, con los
#  arreglos de shaders PowerVR) como assets que la app extrae a files/titles.
# =============================================================================
name: Azahar + Pocket Native (Redmi 9A)

on:
  workflow_dispatch:
    inputs:
      pn_ref:
        description: 'Ref de lavilao/pocket-native (rama, tag o commit)'
        required: false
        default: 'master'
  push:
    branches: [ master, pn-implant ]
    tags: [ 'v*' ]

concurrency:
  group: azahar-pn-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: APK Azahar UI + motor PN (armeabi-v7a, sin núcleo Citra)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros

    steps:
      # ------------------------------------------------------------------ #
      # Preparación                                                        #
      # ------------------------------------------------------------------ #
      - name: Checkout (con submódulos)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Checkout del motor Pocket Native
        uses: actions/checkout@v6
        with:
          repository: lavilao/pocket-native
          ref: ${{ inputs.pn_ref || 'master' }}
          path: pocket-native

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar herramientas (ccache, apksigner)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ccache apksigner

      - name: Instalar NDK 27.3 y CMake 3.30.3 del SDK
        run: |
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "ndk;27.3.13750724" > /dev/null
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "cmake;3.30.3" > /dev/null

      # ------------------------------------------------------------------ #
      # Motor Pocket Native (Rust)                                         #
      # ------------------------------------------------------------------ #
      - name: Caché de Rust (cargo)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: pocket-native

      - name: Compilar el motor (libpocketnative.so, armv7)
        run: |
          rustup target add armv7-linux-androideabi
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$bin/armv7a-linux-androideabi29-clang"
          export CC_armv7_linux_androideabi="$bin/armv7a-linux-androideabi29-clang"
          export AR_armv7_linux_androideabi="$bin/llvm-ar"
          (cd pocket-native && cargo build --release --locked --target armv7-linux-androideabi -p pocket-native-android)

      - name: Empaquetar motor y perfiles en la app
        run: |
          mkdir -p src/android/app/src/main/jniLibs/armeabi-v7a
          "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" \
            -o src/android/app/src/main/jniLibs/armeabi-v7a/libpocketnative.so \
            pocket-native/target/armv7-linux-androideabi/release/libpocketnative.so
          # Perfiles por título (arreglos de shaders PowerVR, opciones por juego)
          mkdir -p src/android/app/src/main/assets/pn/titles
          if compgen -G "pocket-native/titles/*/profile.toml" > /dev/null; then
            for profile in pocket-native/titles/*/profile.toml; do
              id="$(basename "$(dirname "$profile")")"
              mkdir -p "src/android/app/src/main/assets/pn/titles/$id"
              cp "$profile" "src/android/app/src/main/assets/pn/titles/$id/"
            done
          fi
          ls -la src/android/app/src/main/jniLibs/armeabi-v7a/
          find src/android/app/src/main/assets/pn -name '*.toml' | head -5

      # ------------------------------------------------------------------ #
      # APK (UI de Azahar, vanilla release, armeabi-v7a)                   #
      # ------------------------------------------------------------------ #
      - name: Restaurar cachés de compilación
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ github.workspace }}/.ccache
          key: android-pn-armv7-ndk27.3-${{ github.sha }}
          restore-keys: |
            android-pn-armv7-ndk27.3-

      - name: Compilar APK (vanilla release, sin núcleo Citra)
        working-directory: src/android
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x ./gradlew
          export NDK_CCACHE="$(which ccache)"
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "::group::Firma con keystore de los secrets"
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/ks.jks"
            export ANDROID_KEYSTORE_FILE="$GITHUB_WORKSPACE/ks.jks"
            echo "::endgroup::"
          else
            echo "Sin secrets de firma: el APK se firmará con la clave debug del runner (firma no estable: define ANDROID_KEYSTORE_B64/ANDROID_KEYSTORE_PASS/ANDROID_KEY_ALIAS para firma estable)."
          fi
          # -PpocketOnly=true: sin CMake/NDK-build del núcleo Citra — el APK
          # pocket lleva solo la UI de Azahar y libpocketnative.so.
          ./gradlew assembleVanillaRelease -PpocketOnly=true --stacktrace
          echo "::group::Estadísticas de ccache"
          ccache -s || true
          echo "::endgroup::"
          rm -f "$GITHUB_WORKSPACE/ks.jks"

      # ------------------------------------------------------------------ #
      # Resultados                                                         #
      # ------------------------------------------------------------------ #
      - name: Renombrar y recopilar APK
        run: |
          DATE="$(git show -s --date=format:%Y%m%d --format=%cd)"
          REV="$(git rev-parse --short HEAD)"
          PNREV="$(git -C pocket-native rev-parse --short HEAD)"
          mkdir -p artifacts
          cp src/android/app/build/outputs/apk/vanilla/release/*.apk \
             "artifacts/azahar-pn-${DATE}-${REV}+pn${PNREV}-armeabi-v7a.apk"
          ls -lh artifacts/

      - name: Subir artefacto
        uses: actions/upload-artifact@v7
        with:
          name: azahar-pn-armv7
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Publicar en Releases (solo tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
