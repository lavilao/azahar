# =============================================================================
#  Azahar para Redmi 9A — APK armeabi-v7a (32 bits) compilado en GitHub Actions
#  Basado en el CI oficial del proyecto (.github/workflows/build.yml + .ci/android.sh)
#
#  La configuración específica del Redmi 9A ya vive en el propio código del
#  repo (este workflow NO parchea nada con sed):
#    - src/android/app/build.gradle.kts: abiFilter = armeabi-v7a (la MIUI del
#      Redmi 9A es de 32 bits: NO instalará APKs arm64-v8a), backend Vulkan
#      forzado (-DENABLE_VULKAN=ON) y flags -mcpu=cortex-a7 / -O3 (cortex-a7 =
#      ARMv7VE con idiv/NEON/FMA sin confundir la detección de arquitectura).
#    - CMakeLists.txt: target tsl::robin_map disponible en 32 bits (fix del
#      error "Target video_core links to tsl::robin_map" — armeabi-v7a no
#      compila dynarmic, que es donde iba bundled robin_map).
#
#  RENDIMIENTO EN 32 BITS
#   En ARM32 no hay JIT de dynarmic. Este trae el backend RECOMP: el codigo
#   del juego recompilado AOT con 3dsrecomp corre a velocidad nativa en la
#   CPU del telefono (workflow "Recompilar juego para Redmi 9A"), y lo que
#   no cubre pasa por el interprete rapido FastInterp. Sin libreria
#   recompilada equivale a FastInterp.
#
#  VULKAN: tu Redmi 9A SÍ tiene Vulkan (PowerVR GE8320 del Helio G25). El APK
#  compila AMBOS renderizadores (Vulkan + OpenGL ES); tras instalar, actívalo
#  en: Ajustes -> Video -> Renderizador -> Vulkan (si algún juego pinta raro
#  con el driver PowerVR, desde ese mismo menú vuelves a OpenGL ES).
#
#  REQUISITOS: minSdk del proyecto = 29 (Android 10) => justo lo del Redmi 9A.
#
#  MOTOR DE CPU (interruptor excluyente): Ajustes -> General -> "Motor de CPU"
#  (recomp AOT / interprete rapido / interprete de referencia). Si el motor es
#  recomp y el juego no tiene libreria, la app lo avisa al lanzarlo con el flujo
#  completo (rom/ en el repo -> workflow "Recompilar juego" -> .so a recomp/).
#
#  DIAGNOSTICO DE CIERRES: si la app se cierra, el informe completo (hilo,
#  registros, instruccion, biblioteca+0xoffset y mapeos) queda en
#  Android/data/org.azahar_emu.azahar/files/azahar-crash.log. Este workflow
#  ademas sube el .so SIN despoilar como artefacto "azahar-redmi9a-armv7-simbolos"
#  para traducir esos offsets a funciones exactas con llvm-symbolizer.
# =============================================================================
name: Azahar Redmi 9A (32 bits)

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    tags: [ 'v*' ]

concurrency:
  group: azahar-redmi9a-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: APK vanilla release (armeabi-v7a)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: time_macros

    steps:
      # ------------------------------------------------------------------ #
      # Preparación                                                        #
      # ------------------------------------------------------------------ #
      - name: Checkout (con submódulos)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar herramientas (ccache, apksigner)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ccache apksigner

      - name: Instalar NDK 27.3 y CMake 3.30.3 del SDK
        run: |
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "ndk;27.3.13750724" > /dev/null
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "cmake;3.30.3" > /dev/null

      # ------------------------------------------------------------------ #
      # Caché (Gradle + ccache)                                            #
      # ------------------------------------------------------------------ #
      - name: Restaurar cachés de compilación
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ${{ github.workspace }}/.ccache
          key: android-armv7-cortex-a53-ndk27.3-${{ github.sha }}
          restore-keys: |
            android-armv7-cortex-a53-ndk27.3-

      # ------------------------------------------------------------------ #
      # Compilación                                                        #
      # ------------------------------------------------------------------ #
      - name: Compilar APK (vanilla release)
        working-directory: src/android
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x ./gradlew
          export NDK_CCACHE="$(which ccache)"
          if [ -n "$ANDROID_KEYSTORE_B64" ]; then
            echo "::group::Firma con keystore de los secrets"
            echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/ks.jks"
            export ANDROID_KEYSTORE_FILE="$GITHUB_WORKSPACE/ks.jks"
            echo "::endgroup::"
          else
            echo "Sin secrets de firma: el APK se firmará con la clave debug del runner (firma no estable: define ANDROID_KEYSTORE_B64/ANDROID_KEYSTORE_PASS/ANDROID_KEY_ALIAS para firma estable)."
          fi
          ./gradlew assembleVanillaRelease --stacktrace
          echo "::group::Estadísticas de ccache"
          ccache -s || true
          echo "::endgroup::"
          rm -f "$GITHUB_WORKSPACE/ks.jks"

      # ------------------------------------------------------------------ #
      # Resultados                                                         #
      # ------------------------------------------------------------------ #
      - name: Renombrar y recopilar APK
        run: |
          DATE="$(git show -s --date=format:%Y%m%d --format=%cd)"
          REV="$(git rev-parse --short HEAD)"
          mkdir -p artifacts
          cp src/android/app/build/outputs/apk/vanilla/release/*.apk \
             "artifacts/azahar-android-${DATE}-${REV}-armeabi-v7a.apk"
          ls -lh artifacts/

      # Simbolos SIN despoilar del .so nativo: los informes de cierres
      # (azahar-crash.log) traen "biblioteca+0xoffset de archivo"; con este
      # .so y llvm-symbolizer se traduce a funcion y linea exactas.
      - name: Recopilar simbolos del .so nativo
        run: |
          mkdir -p symbols
          UNSTRIPPED="$(find src/android/app/build/intermediates/cxx -name 'libcitra-android.so' -path '*obj/armeabi-v7a*' | head -1)"
          if [ -n "$UNSTRIPPED" ]; then
            cp "$UNSTRIPPED" symbols/
            ls -lh symbols/
          else
            echo "::warning::no se encontró el .so sin despoilar; los informes de cierres no podrán simbolizarse"
          fi

      - name: Subir artefacto
        uses: actions/upload-artifact@v7
        with:
          name: azahar-redmi9a-armv7
          path: |
            artifacts/*.apk
            symbols/*.so
          if-no-files-found: error

      - name: Subir simbolos como artefacto separado
        uses: actions/upload-artifact@v7
        with:
          name: azahar-redmi9a-armv7-simbolos
          path: symbols/*.so
          if-no-files-found: warn

      - name: Publicar en Releases (solo tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
