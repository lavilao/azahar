[package]
name = "zakuro"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A high-level-emulation Nintendo 3DS emulator"

[lib]
path = "src/lib.rs"
# an Android app is a shared library the system loads, while the desktop
# binary links the same code as an rlib
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "zakuro"
path = "src/main.rs"

[dependencies]
zakuro-common.workspace = true
zakuro-core.workspace = true
zakuro-fs.workspace = true
zakuro-gpu = { workspace = true, features = ["opengl", "vulkan"] }
log.workspace = true
env_logger = "0.11"
winit = { version = "0.30", features = ["serde"] }
raw-window-handle = "0.6"
glutin = "0.32"
glutin-winit = "0.5"
cpal = "0.16"
egui = { version = "0.36", default-features = false, features = ["default_fonts"] }
ab_glyph = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
recomp3ds = { git = "https://github.com/fearkov/3dsrecomp" }
sha2 = "0.10"
gilrs = { version = "0.11.2", features = ["serde-serialize"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
egui-winit = { version = "0.36", default-features = false, features = ["clipboard", "wayland", "x11"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }

[target.'cfg(target_os = "android")'.dependencies]
egui-winit = { version = "0.36", default-features = false }
# winit's Android backend, NativeActivity, no Java code needed
winit = { version = "0.30", features = ["android-native-activity"] }
# reaching Context.getExternalFilesDir through JNI, for where games and
# recompiled code go
jni = "0.21"
ndk-context = "0.1"

[dev-dependencies]
zakuro-fs = { workspace = true, features = ["testing"] }
